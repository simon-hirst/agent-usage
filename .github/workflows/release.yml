name: Build and publish releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (for example v3.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ endsWith(matrix.target, '-arm64') && 'arm64' || 'x64' }}
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install headless Qt system libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Check API and desktop tests
        shell: bash
        run: |
          python -m unittest discover -s desktop/tests -q
          python -m unittest discover -s work-codex-usage-api/tests -q
          python -m unittest discover -s claude-usage-api/tests -q
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt 'pyinstaller>=6.22,<7'
      - name: Build, smoke test, and archive native app
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          RELEASE_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          python scripts/build_release.py \
            --version "$RELEASE_VERSION" \
            --target "$RELEASE_TARGET"
      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Fetch all compiled downloads
        uses: actions/download-artifact@v4
        with:
          pattern: '*-x64'
          path: release-assets
          merge-multiple: true
      - name: Fetch ARM64 downloads
        uses: actions/download-artifact@v4
        with:
          pattern: '*-arm64'
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksum file
        shell: bash
        run: |
          cd release-assets
          test "$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)" -eq 6
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "Provider Usage Tray $RELEASE_TAG" \
            --generate-notes
