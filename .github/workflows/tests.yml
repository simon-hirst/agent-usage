name: Python tests
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Codex API tests
        run: python -m unittest discover -s work-codex-usage-api/tests -v
      - name: Claude API tests
        run: python -m unittest discover -s claude-usage-api/tests -v
      - name: Portable tray core and lifecycle tests
        run: python -m unittest discover -s desktop/tests -v
      - name: Check Python syntax
        run: python -m compileall -q desktop work-codex-usage-api claude-usage-api
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Qt dependency
        run: python -m pip install -r requirements.txt
      - name: Smoke test Qt import and tray icon painting
        env:
          QT_QPA_PLATFORM: offscreen
        run: python desktop/tests/smoke_gui.py
